name: Candidate CI (changed folders)

on:
  pull_request:
    branches: [ "main" ]

jobs:
  candidate-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Detect changed candidate folders
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          BASE_REF="${{ github.base_ref }}"
          if [ -z "${BASE_REF}" ]; then
            echo "ERROR: github.base_ref is empty. This workflow must run on pull_request."
            exit 1
          fi

          echo "PR base branch: ${BASE_REF}"
          git fetch origin "${BASE_REF}" --depth=1 || true

          DIFF_RANGE="origin/${BASE_REF}...HEAD"
          echo "Diff range: ${DIFF_RANGE}"

          CHANGED_FILES="$(git diff --name-only "${DIFF_RANGE}" || true)"
          echo "${CHANGED_FILES}" | sed 's/^/CHANGED: /'

          CANDIDATES="$(echo "${CHANGED_FILES}" \
            | grep -E '^candidates/[^/]+/' || true \
            | cut -d/ -f2 \
            | grep -v '^_shared$' \
            | sort -u)"

          # Write output safely (multiline)
          {
            echo "candidates<<EOF"
            echo "${CANDIDATES}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Run Maven tests for changed candidates
        if: steps.detect.outputs.candidates != ''
        shell: bash
        run: |
          set -euo pipefail

